[pytest]
testpaths = tests
pythonpath = .
timeout = 30
addopts = -ra --strict-markers
markers =
    unit: Isolated unit tests for business rules, security, schemas, and time/error helpers
    contract: Producer/consumer contract tests using shared fixtures (CT 1, CT 2)
    interface: Service boundary interface tests (IT 1, IT 2, supporting interfaces)
    failure_path: Outage, duplicate scan, retry, reconciliation, and security failure tests (FP 1, FP 2)
    e2e: End-to-end live HTTPS multi-process tests
