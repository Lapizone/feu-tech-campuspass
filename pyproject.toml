[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-event-system"
version = "1.0.0"
description = "Integrated Campus Event Registration and Attendance System Prototype (Proposal 1:1 Implementation)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "jsonschema>=4.21.0",
    "PyYAML>=6.0.1",
]

[tool.setuptools.packages.find]
include = ["shared*", "services*", "clients*"]
